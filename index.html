<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>Color Picker</title>

	<link rel="stylesheet" href="./css/style.css">

</head>


<body>


<div class="app">


	<!-- Header -->

	<div class="header">

		<h1>
			🎨 Color Picker
		</h1>

		<p>
			Pick colors from any website
		</p>

	</div>




	<!-- Picker Card -->

	<div class="picker-card">


		<div
				id="preview"
				class="preview">

			Select Color

		</div>



		<button id="color-picker">

			Pick Color

		</button>


	</div>





	<!-- History -->


	<div
			id="picked-color"
			class="colors-section hidden">


		<div class="section-header">


			<h3>
				Recent Colors
			</h3>


			<button id="clearAll">
				Clear
			</button>


		</div>



		<ul id="all-colors"></ul>


	</div>



</div>




<script src="./script/script.js"></script>


</body>

</html>
